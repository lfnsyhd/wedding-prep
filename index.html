<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Prep Tracker</title>
    
    <!-- Konfigurasi PWA & iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fit to Size L">
    <meta name="theme-color" content="#020617">

    <!-- Ikon Aplikasi -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23f97316%22/><text y=%22.9em%22 font-size=%2260%22 x=%2218%22>💍</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400,500,600,700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 pb-12">

    <div class="w-full max-w-md space-y-4">
        
        <!-- MAIN CARD -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl">
            <!-- Header -->
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-orange-500">Fit to Size L 💍</h1>
                    <p class="text-xs text-slate-400" id="current-date">Memuat tanggal...</p>
                </div>
                <div class="bg-orange-500/10 border border-orange-500/20 text-orange-400 text-xs px-3 py-1 rounded-full font-medium" id="day-badge">
                    Mode
                </div>
            </div>

            <!-- Tanggal Picker & Reset -->
            <div class="mb-4 flex gap-2">
                <input type="date" id="date-picker" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-orange-500">
                <button onclick="changeDateToToday()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl text-slate-300 transition">Hari Ini</button>
            </div>

            <!-- PANEL: KALENDER 1 BULAN PENUH -->
            <div class="mb-5 bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider" id="month-title">Bulan Ini</span>
                    <span class="text-[10px] text-orange-400 font-medium">Geser & Pilih Tanggal ➔</span>
                </div>
                <!-- Container Horizontal Scroll -->
                <div class="flex gap-2.5 overflow-x-auto no-scrollbar py-2 px-1 items-center" id="month-chart-container">
                    <!-- Di-generate via JS -->
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mb-2 bg-slate-800 rounded-full h-2.5 overflow-hidden border border-slate-700/50">
                <div id="progress-bar" class="bg-gradient-to-r from-orange-500 to-amber-400 h-2.5 transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400 mb-5">
                <span>Progres Harian</span>
                <span id="progress-text">0% Selesai</span>
            </div>

            <!-- Ceklis List -->
            <div class="space-y-3" id="checklist-container">
                <!-- Item akan di-generate via JavaScript -->
            </div>
        </div>

        <!-- PANEL: SUMMARY KALORI TERBAKAR -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center text-orange-400 text-lg">
                    🔥
                </div>
                <div>
                    <p class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Estimasi Kalori Terbakar</p>
                    <h3 class="text-lg font-bold text-slate-100" id="burned-calories">0 <span class="text-xs font-normal text-orange-400">Kcal</span></h3>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-1 rounded-md border border-slate-700" id="calorie-status">Belum ada aktivitas</span>
            </div>
        </div>

        <!-- Footer Info -->
        <p class="text-center text-[10px] text-slate-500 pt-2">Data tersimpan otomatis di perangkat Anda (LocalStorage)</p>
    </div>

    <script>
        const weekdayTasks = [
            { id: 'gojek', label: 'Naik Gojek ke Kantor (Pagi)', cal: 0 },
            { id: 'nosarapan', label: 'Tidak Sarapan (Intermittent)', cal: 0 },
            { id: 'makan_siang', label: 'Makan Siang Terkontrol', cal: 0 },
            { id: 'makan_malam', label: 'Makan Malam Warteg (Jam 7)', cal: 0 },
            { id: 'jalan_pulang', label: 'Jalan Kaki Pulang (1.3 km)', cal: 150 },
            { id: 'lari', label: 'Lari Santai 30 Menit (Hari Kerja)', cal: 250 }
        ];

        const weekendTasks = [
            { id: 'w_nosarapan', label: 'Tidak Sarapan (Kontrol Pagi)', cal: 0 },
            { id: 'w_warmup', label: 'Pemanasan & Peregangan (3 Menit)', cal: 15 },
            { id: 'w_squat', label: 'Goblet Squat 5kg (3 Set x 12 Rep)', cal: 70 },
            { id: 'w_rdl', label: 'Dumbbell Romanian Deadlift 5kg', cal: 60 },
            { id: 'w_press', label: 'Dumbbell Floor Press 5kg', cal: 50 },
            { id: 'w_curl', label: 'Dumbbell Bicep Curl 5kg', cal: 40 },
            { id: 'w_plank', label: 'Plank Core Training (3 Set)', cal: 30 },
            { id: 'w_hydrate', label: 'Minum Air Putih & Istirahat', cal: 0 }
        ];

        function formatDateString(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }

        function getLocalDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        let selectedDate = new Date();
        
        const datePicker = document.getElementById('date-picker');
        const currentDateLabel = document.getElementById('current-date');
        const dayBadge = document.getElementById('day-badge');
        const checklistContainer = document.getElementById('checklist-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const burnedCaloriesLabel = document.getElementById('burned-calories');
        const calorieStatus = document.getElementById('calorie-status');
        const monthChartContainer = document.getElementById('month-chart-container');
        const monthTitle = document.getElementById('month-title');

        function initApp() {
            datePicker.value = getLocalDateKey(selectedDate);
            updateUI();
        }

        datePicker.addEventListener('change', (e) => {
            const parts = e.target.value.split('-');
            if(parts.length === 3) {
                selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
                updateUI();
            }
        });

        function changeDateToToday() {
            selectedDate = new Date();
            datePicker.value = getLocalDateKey(selectedDate);
            updateUI();
        }

        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        function updateUI() {
            currentDateLabel.textContent = formatDateString(selectedDate);
            const dateKey = getLocalDateKey(selectedDate);
            
            let savedData = JSON.parse(localStorage.getItem(dateKey)) || { tasks: {} };
            const weekend = isWeekend(selectedDate);
            const currentTasks = weekend ? weekendTasks : weekdayTasks;

            if (weekend) {
                dayBadge.textContent = "Weekend / Workout 5kg";
                dayBadge.className = "bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs px-3 py-1 rounded-full font-medium";
            } else {
                dayBadge.textContent = "Hari Kerja";
                dayBadge.className = "bg-orange-500/10 border border-orange-500/20 text-orange-400 text-xs px-3 py-1 rounded-full font-medium";
            }

            checklistContainer.innerHTML = '';
            let completedCount = 0;
            let totalBurnedCal = 0;
            const totalTasks = currentTasks.length;

            currentTasks.forEach(task => {
                const isChecked = savedData.tasks[task.id] || false;
                if (isChecked) {
                    completedCount++;
                    totalBurnedCal += task.cal;
                }

                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-xl border transition ${isChecked ? 'bg-orange-500/5 border-orange-500/30 text-orange-200 line-through' : 'bg-slate-800/60 border-slate-700/60 text-slate-200'}`;
                
                div.innerHTML = `
                    <span class="text-xs font-medium">${task.label}</span>
                    <input type="checkbox" data-id="${task.id}" ${isChecked ? 'checked' : ''} class="w-5 h-5 accent-orange-500 rounded cursor-pointer">
                `;

                const checkbox = div.querySelector('input');
                checkbox.addEventListener('change', (e) => {
                    savedData.tasks[task.id] = e.target.checked;
                    localStorage.setItem(dateKey, JSON.stringify(savedData));
                    updateUI();
                });

                checklistContainer.appendChild(div);
            });

            const percent = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}% Selesai (${completedCount}/${totalTasks})`;

            burnedCaloriesLabel.innerHTML = `${totalBurnedCal} <span class="text-xs font-normal text-orange-400">Kcal</span>`;
            if (totalBurnedCal > 300) {
                calorieStatus.textContent = "Bakar Kalori Mantap! 🔥";
            } else if (totalBurnedCal > 0) {
                calorieStatus.textContent = "Aktivitas Terdeteksi 👍";
            } else {
                calorieStatus.textContent = "Belum ada aktivitas";
            }

            renderMonthCalendar();
        }

        function renderMonthCalendar() {
            monthChartContainer.innerHTML = '';
            
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            monthTitle.textContent = `Kalender ${monthNames[month]} ${year}`;

            const totalDays = new Date(year, month + 1, 0).getDate();
            let targetCard = null;

            for (let day = 1; day <= totalDays; day++) {
                const d = new Date(year, month, day);
                const dKey = getLocalDateKey(d);
                
                const dayData = JSON.parse(localStorage.getItem(dKey)) || { tasks: {} };
                const isWknd = isWeekend(d);
                const tasksList = isWknd ? weekendTasks : weekdayTasks;
                
                let doneCount = 0;
                tasksList.forEach(t => {
                    if (dayData.tasks[t.id]) doneCount++;
                });
                
                const pct = tasksList.length > 0 ? Math.round((doneCount / tasksList.length) * 100) : 0;
                const isSelectedDay = dKey === getLocalDateKey(selectedDate);

                const dayName = d.toLocaleDateString('id-ID', { weekday: 'short' });

                const card = document.createElement('div');
                card.className = `min-w-[62px] p-2 rounded-xl border flex flex-col items-center justify-between transition-all duration-300 cursor-pointer ${isSelectedDay ? 'bg-orange-500/20 border-orange-500 text-orange-300 ring-2 ring-orange-500 scale-110 z-10 shadow-lg shadow-orange-500/20' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:bg-slate-800'}`;
                
                card.innerHTML = `
                    <span class="text-[9px] font-semibold uppercase">${dayName}</span>
                    <span class="text-xs font-bold ${isSelectedDay ? 'text-orange-200' : 'text-slate-200'} my-0.5">${day}</span>
                    <div class="w-full bg-slate-950 rounded-full h-1.5 my-1 overflow-hidden">
                        <div class="bg-orange-500 h-1.5 rounded-full transition-all" style="width: ${pct}%"></div>
                    </div>
                    <span class="text-[9px] font-bold ${pct === 100 ? 'text-emerald-400' : 'text-slate-400'}">${pct}%</span>
                `;

                card.addEventListener('click', () => {
                    selectedDate = new Date(year, month, day);
                    datePicker.value = getLocalDateKey(selectedDate);
                    updateUI();
                });

                if (isSelectedDay) {
                    targetCard = card;
                }

                monthChartContainer.appendChild(card);
            }

            // Auto-scroll dengan kalibrasi ekstra agar kotak terfokus benar-benar pas di tengah layar
            if (targetCard) {
                setTimeout(() => {
                    const container = monthChartContainer;
                    // Disesuaikan dengan menggeser sedikit lebih banyak ke kiri agar pas di tengah screen
                    const scrollLeftTarget = targetCard.offsetLeft - (container.clientWidth / 2) + (targetCard.clientWidth / 2) + 10;
                    container.scrollTo({
                        left: scrollLeftTarget,
                        behavior: 'smooth'
                    });
                }, 50);
            }
        }

        initApp();
    </script>
</body>
</html>
